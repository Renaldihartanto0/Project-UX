<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | SlateMarket</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-slate-50 text-slate-800">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 border-b border-slate-200 bg-white">

        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">

            <a href="../index.html" class="text-2xl font-bold text-slate-900">
                Slate<span class="text-slate-500">Market</span>
            </a>

            <nav class="flex items-center gap-5 text-sm font-medium">

                <a href="../index.html" class="text-slate-600 hover:text-slate-900">
                    Beranda
                </a>

                <a href="cart.html" class="text-slate-600 hover:text-slate-900">
                    Keranjang
                </a>

                <a href="wishlist.html" class="text-slate-900">
                    Wishlist
                </a>

            </nav>

        </div>

    </header>


    <!-- MAIN -->
    <main class="mx-auto min-h-screen max-w-7xl px-4 py-8">

        <!-- BREADCRUMB -->
        <nav class="mb-6 text-sm text-slate-500">

            <a href="../index.html" class="hover:text-slate-900">
                Beranda
            </a>

            <span class="mx-2">/</span>

            <span class="font-medium text-slate-900">
                Wishlist
            </span>

        </nav>


        <!-- TITLE -->
        <div class="mb-8">

            <h1 class="text-3xl font-bold text-slate-900">
                Wishlist
            </h1>

            <p class="mt-2 text-slate-500">
                Produk yang kamu simpan untuk dibeli nanti.
            </p>

        </div>


        <!-- WISHLIST PRODUCTS -->
        <section>

            <div
                id="wishlist-grid"
                class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4"
            >
                <!-- Produk akan ditampilkan melalui JavaScript -->
            </div>


            <!-- EMPTY STATE -->
            <div
                id="wishlist-empty"
                class="hidden rounded-xl border border-slate-200 bg-white p-10 text-center"
            >

                <div class="mb-4 text-5xl">
                    ♡
                </div>

                <h2 class="text-xl font-bold text-slate-900">
                    Wishlist kamu masih kosong
                </h2>

                <p class="mt-2 text-sm text-slate-500">
                    Simpan produk favoritmu agar mudah ditemukan kembali.
                </p>

                <a
                    href="../index.html"
                    class="mt-6 inline-block rounded-lg bg-slate-900 px-6 py-3 font-semibold text-white hover:bg-slate-700"
                >
                    Jelajahi Produk
                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="border-t border-slate-200 bg-white py-6">

        <div class="mx-auto max-w-7xl px-4 text-center text-sm text-slate-500">
            © 2026 SlateMarket. All rights reserved.
        </div>

    </footer>


    <!-- PRODUCT DATA -->
    <script src="../js/data/products.js"></script>

    <!-- WISHLIST JAVASCRIPT -->
    <script src="../js/pages/wishlist.js"></script>

</body>
</html>
