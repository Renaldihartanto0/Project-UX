```html
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil Saya - SlateMarket</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100">

    <!-- HEADER -->
    <header class="border-b bg-white">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">

            <a href="../index.html"
                class="text-2xl font-extrabold tracking-tight text-slate-900">
                Slate<span class="text-slate-500">Market</span>
            </a>

            <a href="../index.html"
                class="text-sm font-semibold text-slate-600 hover:text-slate-900">
                ← Beranda
            </a>

        </div>
    </header>


    <!-- MAIN -->
    <main class="mx-auto max-w-3xl px-4 py-10">

        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-slate-900">
                Profil Saya
            </h1>

            <p class="mt-2 text-slate-500">
                Kelola informasi akun SlateMarket kamu.
            </p>
        </div>


        <!-- PROFILE CARD -->
        <section class="rounded-2xl border bg-white p-6 shadow-sm sm:p-8">

            <!-- PROFILE AVATAR -->
            <div class="mb-8 flex items-center gap-4">

                <div
                    class="grid h-16 w-16 place-items-center rounded-full bg-slate-900 text-2xl font-bold text-white"
                    id="profile-avatar">
                    U
                </div>

                <div>
                    <h2 id="profile-name"
                        class="text-xl font-bold text-slate-900">
                        Nama Pengguna
                    </h2>

                    <p id="profile-email"
                        class="text-sm text-slate-500">
                        email@example.com
                    </p>
                </div>

            </div>


            <!-- MESSAGE -->
            <div id="message"
                class="mb-4 hidden rounded-xl p-3 text-sm">
            </div>


            <!-- EDIT PROFILE FORM -->
            <form id="profile-form" class="space-y-5">

                <div>
                    <label for="name"
                        class="mb-1 block text-sm font-semibold text-slate-700">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                        minlength="2"
                        class="w-full rounded-xl border px-4 py-3 outline-none transition focus:border-slate-500"
                    >
                </div>


                <div>
                    <label for="email"
                        class="mb-1 block text-sm font-semibold text-slate-700">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                        class="w-full rounded-xl border px-4 py-3 outline-none transition focus:border-slate-500"
                    >
                </div>


                <button
                    type="submit"
                    class="w-full rounded-xl bg-slate-900 py-3 font-bold text-white transition hover:bg-slate-700"
                >
                    Simpan Perubahan
                </button>

            </form>


            <!-- LOGOUT -->
            <div class="mt-8 border-t pt-6">

                <button
                    id="logout-button"
                    class="w-full rounded-xl border border-red-200 py-3 font-bold text-red-600 transition hover:bg-red-50"
                >
                    Logout
                </button>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="../js/pages/profile.js"></script>

</body>

</html>
```
