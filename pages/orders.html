<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pesanan Saya - SlateMarket</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100">

    <!-- HEADER -->
    <header class="border-b bg-white">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">

            <a href="../index.html"
                class="text-2xl font-extrabold tracking-tight text-slate-900">
                Slate<span class="text-slate-500">Market</span>
            </a>

            <a href="../index.html"
                class="text-sm font-semibold text-slate-600 hover:text-slate-900">
                ← Beranda
            </a>

        </div>
    </header>


    <!-- MAIN -->
    <main class="mx-auto max-w-5xl px-4 py-10">

        <!-- TITLE -->
        <div class="mb-6">
            <h1 class="text-3xl font-extrabold text-slate-900">
                Pesanan Saya
            </h1>

            <p class="mt-2 text-slate-500">
                Lihat riwayat transaksi dan detail pesanan kamu.
            </p>
        </div>


        <!-- ORDER LIST -->
        <div id="order-list" class="space-y-5">
        </div>


        <!-- EMPTY STATE -->
        <div id="empty-state"
            class="hidden rounded-2xl border bg-white p-10 text-center">

            <div class="mb-4 text-5xl">
                📦
            </div>

            <h2 class="text-xl font-bold text-slate-900">
                Belum Ada Pesanan
            </h2>

            <p class="mt-2 text-sm text-slate-500">
                Kamu belum melakukan pemesanan.
            </p>

            <a href="../index.html"
                class="mt-6 inline-block rounded-xl bg-slate-900 px-6 py-3 font-bold text-white transition hover:bg-slate-700">
                Mulai Belanja
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script src="../js/data/products.js"></script>
    <script src="../js/pages/orders.js"></script>

</body>

</html>
